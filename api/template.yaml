AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Klyro planner API. Turns an instruction plus file metadata into a plan. Never receives file contents.

Parameters:
  ModelId:
    Type: String
    Default: openai.gpt-oss-120b
    Description: Model ID on the Bedrock Mantle endpoint (must support tool calls)
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:5173
    Description: Origins allowed to call the API (the deployed site, plus localhost for development)
  MockPlanner:
    Type: String
    Default: '0'
    AllowedValues: ['0', '1']
    Description: Set to 1 to use the keyword planner instead of Bedrock
  MaxConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >
      Planner runs allowed at once. Reserving concurrency is only possible on an
      account with room to spare above the minimum AWS keeps unreserved, and
      this one has a limit of 10, so the default is off and the ceiling comes
      from the API throttle below instead.

Conditions:
  # Reserving concurrency fails on accounts whose unreserved pool would fall
  # below the minimum AWS insists on keeping, so it has to be optional.
  CapConcurrency: !Not [!Equals [!Ref MaxConcurrency, 0]]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    # the planner answers in a few seconds or not at all; 30 s just bills longer
    Timeout: 15

Resources:
  PlanApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 600
      # the only ceiling available on this account, so it is the tighter one:
      # a person typing an instruction never notices, a loop gets 429s
      DefaultRouteSettings:
        ThrottlingRateLimit: 2
        ThrottlingBurstLimit: 5

  PlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: plan.handler
      # dist/ is produced by `npm run bundle` (esbuild); nothing else ships to Lambda
      CodeUri: dist/
      # The endpoint is public, and the cost of abusing it would be Bedrock
      # tokens rather than pennies. Two at a time is plenty for a person using
      # the command bar and caps a flood at roughly one request a second.
      ReservedConcurrentExecutions: !If [CapConcurrency, !Ref MaxConcurrency, !Ref 'AWS::NoValue']
      LoggingConfig:
        LogGroup: !Ref PlanLogs
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
          MOCK_PLANNER: !Ref MockPlanner
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock-mantle:CreateInference
              Resource: '*'
      Events:
        Plan:
          Type: HttpApi
          Properties:
            ApiId: !Ref PlanApi
            Path: /plan
            Method: POST

  PlanLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

Outputs:
  ApiUrl:
    Description: Set this as VITE_API_URL in the web app
    Value: !Sub https://${PlanApi}.execute-api.${AWS::Region}.amazonaws.com
