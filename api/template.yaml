AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Klyro planner API. Turns an instruction plus file metadata into a plan. Never receives file contents.

Parameters:
  ModelId:
    Type: String
    Default: openai.gpt-oss-120b
    Description: Model ID on the Bedrock Mantle endpoint (must support tool calls)
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:5173
    Description: Origins allowed to call the API (the deployed site, plus localhost for development)
  MockPlanner:
    Type: String
    Default: '0'
    AllowedValues: ['0', '1']
    Description: Set to 1 to use the keyword planner instead of Bedrock

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 30

Resources:
  PlanApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10

  PlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: plan.handler
      # dist/ is produced by `npm run bundle` (esbuild); nothing else ships to Lambda
      CodeUri: dist/
      LoggingConfig:
        LogGroup: !Ref PlanLogs
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
          MOCK_PLANNER: !Ref MockPlanner
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock-mantle:CreateInference
              Resource: '*'
      Events:
        Plan:
          Type: HttpApi
          Properties:
            ApiId: !Ref PlanApi
            Path: /plan
            Method: POST

  PlanLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

Outputs:
  ApiUrl:
    Description: Set this as VITE_API_URL in the web app
    Value: !Sub https://${PlanApi}.execute-api.${AWS::Region}.amazonaws.com
