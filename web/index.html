<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04070d" />
    <meta
      name="description"
      content="Compress, resize, convert, merge and split files without uploading them. Everything runs in your browser."
    />
    <title>Klyro — file tools that never upload your files</title>
    <link rel="canonical" href="https://klyro.zeusdotdev.app/" />

    <!--
      The fallback head. `scripts/seo.mjs` rewrites these per route at build
      time, so a crawler on /tools/pdf-merge gets that page's own title. What is
      here is what dev and any unlisted route serve.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Klyro" />
    <meta property="og:title" content="Klyro — file tools that never upload your files" />
    <meta
      property="og:description"
      content="56 image, PDF and video tools that run entirely in your browser. No account, no upload, and a live counter proving nothing left the tab."
    />
    <meta property="og:url" content="https://klyro.zeusdotdev.app/" />
    <meta property="og:image" content="https://klyro.zeusdotdev.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="Klyro: your files never leave this tab. Counters reading zero off-origin requests and zero file bytes sent."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://klyro.zeusdotdev.app/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
