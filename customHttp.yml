applications:
  - appRoot: web
    customHeaders:
      - pattern: '**/*'
        headers:
          # connect-src is the privacy boundary: the page can only talk to itself and the planner API
          - key: Content-Security-Policy
            value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' https://bpnrtqfqtc.execute-api.ap-south-1.amazonaws.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
          - key: Referrer-Policy
            value: no-referrer
          - key: X-Content-Type-Options
            value: nosniff
          # the camera is used only while you hold the Scan tool open; frames stay in the tab
          - key: Permissions-Policy
            value: camera=(self), microphone=(), geolocation=(), payment=()
          - key: Strict-Transport-Security
            value: max-age=31536000; includeSubDomains
      - pattern: '/assets/**'
        headers:
          - key: Cache-Control
            value: public, max-age=31536000, immutable
